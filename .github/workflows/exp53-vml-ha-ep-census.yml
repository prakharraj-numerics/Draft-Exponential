name: EXP53 targeted VML HA EP census
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp53-vml-ha-ep-census.yml'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore oneAPI
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1
      - name: Census exact HA and EP exp kernels
        shell: bash
        run: |
          set -euo pipefail
          VML=/opt/intel/oneapi/mkl/latest/lib/libmkl_vml_avx512.so.3
          OUT=/tmp/vml_ha_ep_census.txt
          echo "HOST_CPU=$(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2);print $2;exit}')" > "$OUT"
          echo 'STATIC_BINARY=libmkl_vml_avx512.so.3' >> "$OUT"
          echo '=== candidate double exp kernels ===' >> "$OUT"
          objdump -T "$VML" | grep -E 'mkl_vml_kernel_dExp(_|I_)Z0(HA|EP)' >> "$OUT" || true
          HA=$(objdump -T "$VML" | awk '/mkl_vml_kernel_dExp_Z0HA/{print $NF; exit}')
          EP=$(objdump -T "$VML" | awk '/mkl_vml_kernel_dExp_Z0EP/{print $NF; exit}')
          echo "HA_SYM=$HA" >> "$OUT"
          echo "EP_SYM=$EP" >> "$OUT"
          for spec in HA:$HA EP:$EP; do
            tag=${spec%%:*}; sym=${spec#*:}
            asm=/tmp/${tag}.asm
            objdump -d -M intel --disassemble="$sym" "$VML" > "$asm"
            ins=$(grep -Ec '^ *[0-9a-f]+:' "$asm" || true)
            bytes=$(objdump -T "$VML" | awk -v s="$sym" '$NF==s{print "0x"$5;exit}')
            gather=$(grep -Eci 'vgather|vpgather' "$asm" || true)
            perm=$(grep -Eci 'vperm|vpermi|vpermt|vshuf|vpshuf' "$asm" || true)
            fma=$(grep -Eci 'vfmadd|vfnmadd|vfmsub|vfnmsub' "$asm" || true)
            mul=$(grep -Eci '\bvmulp[sd]\b|\bvmuls[sd]\b' "$asm" || true)
            addsub=$(grep -Eci '\bvaddp[sd]\b|\bvsubp[sd]\b|\bvaddsd\b|\bvsubsd\b' "$asm" || true)
            cvt=$(grep -Eci '\bvcvt|\bvcvtt' "$asm" || true)
            shifts=$(grep -Eci 'vpsll|vpsrl|vpsra|vps[lr][al][qd]' "$asm" || true)
            branches=$(grep -Eci '\bj[a-z]+\b|\bcall\b' "$asm" || true)
            zmm=$(grep -Eo 'zmm[0-9]+' "$asm" | sort -u | wc -l)
            ymm=$(grep -Eo 'ymm[0-9]+' "$asm" | sort -u | wc -l)
            echo "CENSUS tag=$tag sym=$sym size=$bytes ins=$ins gather=$gather perm=$perm fma=$fma mul=$mul addsub=$addsub cvt=$cvt shifts=$shifts branches_calls=$branches zmm=$zmm ymm=$ymm" >> "$OUT"
            echo "--- $tag selected vector instructions ---" >> "$OUT"
            grep -Ei 'vgather|vperm|vshuf|vfmadd|vfnmadd|vfmsub|vmulpd|vaddpd|vsubpd|vcvt|vpsll|vpsrl|vpsra' "$asm" | head -160 >> "$OUT" || true
          done
          cat "$OUT"
      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: exp53-vml-ha-ep-census
          path: /tmp/vml_ha_ep_census.txt
